[package]
name = "lcms"
version = "0.0.0"
description = "Pure-Rust, bit-exact port of Little CMS (lcms2) 2.20"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# unsafe_code is forbidden in the library itself via #![forbid] in lib.rs;
# tests call the C oracle through lcms-cref and need unsafe FFI.

[features]
# Math provider for transcendental fns (the lcms math module) — pick one.
# - math-libm (default): pure-Rust libm; deterministic, unsafe-free.
# - math-rust: pure f64 methods; host-deterministic, not oracle-exact.
# - math-zen: reserved for a correctly-rounded zenmath impl.
# Surface features:
# - little-cms-api (default): the C-parity `cms*`/`pub mod` surface —
#   what the differential gates test. Off => those modules go pub(crate);
#   consumers get only `lcms::api` (+ `lcms2` compat under lcms2-api).
# - lcms2-api: lcms::lcms2 — a drop-in API shim matching the `lcms2`
#   crate's shape (Transform<I,O> + Pod pixels) for easy migrations.
default = ["little-cms-api", "math-libm"]
little-cms-api = []
lcms2-api = []
math-rust = []
math-zen = []
math-libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2.11", optional = true }
# Fallible zeroed allocation for the big optimizer/CLUT tables — avoids the
# write-then-memset of `vec![0; n]` and returns Result instead of panicking.
bytemuck = { version = "1.25.0", default-features = false, features = ["extern_crate_alloc"] }
# Safe SIMD via CPU-token dispatch — lets release builds run AVX2/AVX-512
# paths the C oracle's baseline `-O2` codegen can't reach.
magetypes = { path = "/home/lilith/work/archmage/magetypes", features = ["avx512"] }
archmage = { path = "/home/lilith/work/archmage", features = ["avx512"] }

[dev-dependencies]
lcms-cref = { path = "../lcms-cref" }
zenbench = "0.1.10"
zenhash = { path = "/home/lilith/work/zen/zenhash", features = ["xxh3"] }

[[bench]]
name = "perf_zenbench"
harness = false
