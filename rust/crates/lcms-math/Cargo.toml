[package]
name = "lcms-math"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Math provider for transcendental fns — pick exactly one.
# - math-libm (default): pure-Rust libm crate; deterministic xplat,
#   unsafe-free — the shipped canonical provider.
# - math-rust: pure f64 methods (compiler_builtins); host-deterministic.
# - math-zen: reserved for a correctly-rounded zenmath impl.
default = ["math-libm"]
math-rust = []
math-zen = []
math-libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2.11", optional = true }
