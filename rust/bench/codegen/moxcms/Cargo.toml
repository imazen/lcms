[package]
name = "moxcms-codegen-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
moxcms = { version = "=0.9.2", default-features = false, features = ["lut"] }

[features]
default = ["moxcms/default"]
inspect = []

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
